name: sync-upstream

on:
  schedule:
    - cron: '43 3 * * *' # daily 03:43 UTC = 11:43 Beijing
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Full clone, not --depth: sync.mjs must diff against the SHA recorded in
      # data/last-sha.json, which a shallow window drops once upstream gains
      # ~50+ commits between runs (that exact failure started 2026-10-16).
      - name: Fetch upstream
        run: git clone https://github.com/anthropics/claude-plugins-official.git .upstream

      - name: Compute diff
        run: node tools/sync.mjs

      # Translations run locally (the API key is IP-whitelisted, unusable on
      # GitHub runners) and are committed as i18n/zh ledger files. Untranslated
      # entries simply keep their English text until the next local pass.

      - name: Refresh icons (best-effort)
        run: node tools/fetch-icons.mjs || echo "[warn] icon fetch failed, keeping committed icons"

      - name: Compose zh marketplace
        run: node tools/compose.mjs

      - name: Verify lossless (gate)
        run: node tools/verify.mjs

      - name: Commit and push
        run: |
          git config user.name "claude-plugins-zh-bot"
          git config user.email "actions@users.noreply.github.com"
          sha=$(node -p "require('./data/last-sha.json').sha.slice(0,9)")
          git add -A
          if git diff --cached --quiet; then
            echo "no changes since last sync"
          else
            git commit -m "sync: upstream ${sha} (lossless verified)"
            git push
          fi
